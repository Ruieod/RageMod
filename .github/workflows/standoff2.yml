name: Standoff2
on:
  push:
    paths:
      - 'standoff2/**'
      - '.github/workflows/standoff2.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libragemod.so
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ./standoff2/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libragemod-arm64
          path: standoff2/build/arm64/libragemod.so
          retention-days: 90
